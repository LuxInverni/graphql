<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphQL Profile</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main id="loginpage">
        <section>
            <h1>Login</h1>

            <form id="login-form">
                <input 
                    id="identifier"
                    type="text"
                    placeholder="Username or email"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>
                <p id="error"></p>
            </form>
        </section>
    </main>


    <script type="module" src="./js/main.js"></script>

</body>
</html>
